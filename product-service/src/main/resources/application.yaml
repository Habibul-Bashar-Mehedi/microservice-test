server:
  port: 8082
spring:
  application:
    name: product-service

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://localhost:5432/product-service
    username: lemon
    password: lemon
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true