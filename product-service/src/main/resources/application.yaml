server:
  port: 8082
spring:
  application:
    name: product-service

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  cloud:
    stream:
      default:
        content-type: application/json
      bindings:
        orderConfirmedListener-in-0:
          destination: order.confirmed
          group: product-service
        stockUpdated-out-0:
          destination: stock.updated
        stockFailed-out-0:
          destination: stock.failed
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true

  elasticsearch:
    uris: http://localhost:9200

  datasource:
    url: jdbc:postgresql://localhost:5432/product-service
    username: lemon
    password: lemon
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          issuer-uri: https://accounts.google.com

jwt:
