<h1>Dashboard</h1>

<p class="message" [style.color]="isError() ? '#b00020' : '#0a7d32'">{{ message() }}</p>

<h2>Product List</h2>
<button type="button" (click)="loadProducts()">Refresh</button>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Available Quantity</th>
        <th>Order Quantity</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
        @for (p of products(); track p.id) {
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.price }}</td>
                <td>{{ p.availableQuantity }}</td>
                <td>
                    <input
                        type="number"
                        min="1"
                        [max]="p.availableQuantity"
                        name="quantity-{{ p.id }}"
                        [(ngModel)]="quantities[p.id]"
                    >
                </td>
                <td>
                    <button type="button" (click)="addToCart(p)">Add to Cart</button>
                    <button type="button" (click)="placeOrder(p)" [disabled]="placing()">Order Now</button>
                </td>
            </tr>
        }
    </tbody>
</table>
