<h1>Notifications</h1>
<button type="button" (click)="load()">Refresh</button>
<button type="button" (click)="markAllRead()">Mark all read</button>
<p class="message" [style.color]="isError() ? '#b00020' : '#0a7d32'">{{ message() }}</p>

@if (notifications().length === 0) {
    <p>No notifications.</p>
} @else {
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Message</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
            @for (n of notifications(); track n.id) {
                <tr>
                    <td>{{ n.id }}</td>
                    <td>{{ n.productName }}</td>
                    <td [style.fontWeight]="n.read ? 'normal' : 'bold'">{{ n.message }}</td>
                    <td>{{ n.read ? 'Read' : 'Unread' }}</td>
                    <td>
                        @if (!n.read) {
                            <button type="button" (click)="markRead(n)">Mark read</button>
                        }
                    </td>
                </tr>
            }
        </tbody>
    </table>
}
