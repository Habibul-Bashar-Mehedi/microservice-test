<div class="chatbot">
    @if (open()) {
        <section class="chat-panel">
            <header class="chat-header">
                <div>
                    <strong>Assistant</strong>
                    <span class="chat-role">{{ role }}</span>
                </div>
                <button type="button" class="chat-close" (click)="toggle()" aria-label="Close">×</button>
            </header>

            <div class="chat-messages">
                @for (m of messages(); track $index) {
                    <div class="chat-message" [class.from-user]="m.role === 'user'">
                        <p>{{ m.text }}</p>
                    </div>
                }
                @if (sending()) {
                    <div class="chat-message">
                        <p class="chat-typing">…</p>
                    </div>
                }
            </div>

            @if (pending) {
                <div class="chat-confirm">
                    <p>{{ pending.summary || 'Are you sure you want to proceed?' }}</p>
                    <div class="chat-confirm-actions">
                        <button type="button" (click)="confirm()" [disabled]="sending()">Yes, confirm</button>
                        <button type="button" class="secondary" (click)="cancel()" [disabled]="sending()">Cancel</button>
                    </div>
                </div>
            } @else {
                <form class="chat-input" (ngSubmit)="send()">
                    <input
                        type="text"
                        name="chat"
                        autocomplete="off"
                        placeholder="Ask about products, approvals or orders..."
                        [(ngModel)]="draft"
                        [disabled]="sending()"
                    >
                    <button type="submit" [disabled]="sending()">Send</button>
                </form>
            }
        </section>
    }

    <button type="button" class="chat-launcher" (click)="toggle()">
        {{ open() ? '×' : '💬' }}
    </button>
</div>
