<h1>Register</h1>

<form (ngSubmit)="register()">
    <label>Name <input type="text" name="name" [(ngModel)]="form.name" required></label>
    <label>Email <input type="email" name="email" [(ngModel)]="form.email" required></label>
    <label>
        Password
        <span class="password-wrap">
            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="form.password" required>
            <button type="button" class="eye-btn" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">{{ showPassword ? '🙈' : '👁️' }}</button>
        </span>
    </label>
    <label>
        Confirm Password
        <span class="password-wrap">
            <input [type]="showPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="form.confirmPassword" required>
        </span>
    </label>
    <button type="submit">Register</button>
</form>
<p class="message" [style.color]="isError() ? '#b00020' : '#0a7d32'">{{ message() }}</p>

<p>Already have an account? <a routerLink="/login">Login</a></p>
