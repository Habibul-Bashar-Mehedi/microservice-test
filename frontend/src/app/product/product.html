<h1>Products</h1>

<h2>Create Product</h2>
<form (ngSubmit)="create()">
    <label>Name <input type="text" name="name" [(ngModel)]="form.name" required></label>
    <label>Price <input type="number" name="price" step="0.01" min="0" [(ngModel)]="form.price" required></label>
    <label>Available Quantity <input type="number" name="availableQuantity" min="0" [(ngModel)]="form.availableQuantity" required></label>
    <button type="submit">Create Product</button>
</form>
<p class="message" [style.color]="isError() ? '#b00020' : '#0a7d32'">{{ message() }}</p>

<h2>All Products</h2>
<button type="button" (click)="load()">Refresh</button>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Available Quantity</th>
        <th>Add Stock</th>
        <th>Update Price</th>
        <th>Update Name</th>
    </tr>
    </thead>
    <tbody>
        @for (p of products(); track p.id) {
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.price }}</td>
                <td>{{ p.availableQuantity }}</td>
                <td>
                    <input
                        type="number"
                        min="1"
                        name="add-stock-{{ p.id }}"
                        [(ngModel)]="amounts[p.id]"
                        placeholder="Qty"
                    >
                    <button type="button" (click)="addQuantity(p)">Add</button>
                </td>
                <td>
                    <input
                        type="number"
                        min="0.01"
                        step="0.01"
                        name="price-{{ p.id }}"
                        [(ngModel)]="prices[p.id]"
                        placeholder="New price"
                    >
                    <button type="button" (click)="updatePrice(p)">Update</button>
                </td>
                <td>
                    <input
                        type="text"
                        name="name-{{ p.id }}"
                        [(ngModel)]="names[p.id]"
                        placeholder="New name"
                    >
                    <button type="button" (click)="updateName(p)">Update</button>
                </td>
            </tr>
        }
    </tbody>
</table>
