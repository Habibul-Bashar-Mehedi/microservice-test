<section class="login-page">
    <div class="login-glow" aria-hidden="true"></div>

    <div class="login-card">
        <header class="login-brand">
            <span class="login-logo">M</span>
            <h1>Microservice&#8209;Tests</h1>
            <p class="login-subtitle">Sign in to your workspace to continue</p>
        </header>

        <div class="login-divider"><span>Continue with</span></div>

        <div class="google-button-wrap">
            <div #googleButton class="google-button"></div>
        </div>

        @if (message()) {
            <div class="alert login-alert" [class.alert-error]="isError()" [class.alert-info]="!isError()" role="status">
                <app-icon [name]="isError() ? 'alert' : 'info'" [size]="17" />
                <span>{{ message() }}</span>
            </div>
        }

        <p class="login-footer">
            Authorized access only. Securely signed in with your Google account.
        </p>
    </div>

    <p class="login-meta">Reference e-commerce platform &middot; Secure JWT access</p>
</section>
