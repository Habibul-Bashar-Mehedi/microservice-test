server:
  port: 8083

user-service:
  base-url: http://localhost:8081
  get-user:
    method: GET
    path: /v1/users/{id}

product-service:
  base-url: http://localhost:8082
  update-quantity:
    method: PUT
    path: /v1/products/{id}/quantity

log-service:
  base-url: http://localhost:8084

spring:
  application:
    name: order-service

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  cloud:
    function:
      definition: orderCreatedListener;stockUpdatedListener;stockUpdateFailedListener
    stream:
      default:
        content-type: application/json
      bindings:
        orderCreated-out-0:
          destination: order.created
        orderConfirmed-out-0:
          destination: order.confirmed
        orderCreatedListener-in-0:
          destination: order.created
          group: order-service
        stockUpdatedListener-in-0:
          destination: stock.updated
          group: order-service
        stockUpdateFailedListener-in-0:
          destination: stock.failed
          group: order-service
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order-service
    username: lemon
    password: lemon
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          issuer-uri: https://accounts.google.com

