server:
  port: 8083

user-service:
  base-url: http://localhost:8081
  get-user:
    method: GET
    path: /v1/users/{id}

product-service:
  base-url: http://localhost:8082
  update-quantity:
    method: PUT
    path: /v1/products/{id}/quantity

spring:
  application:
    name: order-service

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://localhost:5432/order-service
    username: lemon
    password: lemon
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: microservice-tests-super-secret-key-please-change-0123456789
